name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx drizzle-kit check
      - run: npm run db:generate
      - name: Fail if schema.ts has changes without a committed migration
        run: test -z "$(git status --porcelain -- drizzle)"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Last, since Next 16 runs one next dev per repo and the e2e demo server is one.
      - name: Demo smoke (npm run demo answers /api/health, then stops)
        timeout-minutes: 5
        run: |
          npm run demo > demo.log 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            if curl -sf -m 5 http://localhost:3000/api/health > /dev/null; then
              kill "$pid"
              wait "$pid" || true
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || break
            sleep 1
          done
          cat demo.log
          kill "$pid" 2> /dev/null || true
          exit 1

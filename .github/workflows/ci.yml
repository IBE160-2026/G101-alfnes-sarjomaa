name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The integration tests on real Postgres, the driver a hosted deployment uses (AC5).
  postgres:
    name: Integration tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -- tests/integration

  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx drizzle-kit check
      - run: npm run db:generate
      - name: Fail if schema.ts has changes without a committed migration
        run: test -z "$(git status --porcelain -- drizzle)"
      - run: npm test
      - run: npm run judge:eval
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Last, since Next 16 runs one next dev per repo and the e2e demo server is one.
      - name: Demo smoke (npm run demo answers /api/health, then stops)
        timeout-minutes: 5
        run: |
          npm run demo > demo.log 2>&1 &
          pid=$!
          # A deadline, not a try count, so a hanging compile still prints the log well before timeout-minutes.
          end=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$end" ]; do
            if curl -sf -m 2 http://localhost:3000/api/health > /dev/null; then
              kill "$pid"
              wait "$pid" || true
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || break
            sleep 1
          done
          cat demo.log
          kill "$pid" 2> /dev/null || true
          exit 1
